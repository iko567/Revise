<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revision tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B3A9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revise">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F8;--card:#fff;--ink:#1D2757;--mute:#5B6688;--line:#D3DAEA;--hi:#FFE169;--hi-ink:#4A3B00;--ok:#1F8A5B;--ok-ink:#fff;--bad:#C0362D;--accent:#2B3A9E;--accent-ink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10152B;--card:#1A2140;--ink:#E8ECFA;--mute:#9AA5C8;--line:#2E3862;--hi:#E8C93A;--hi-ink:#2B2200;--ok:#4CC38A;--ok-ink:#08210F;--bad:#FF8076;--accent:#8E9CFF;--accent-ink:#10152B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10152B;--card:#1A2140;--ink:#E8ECFA;--mute:#9AA5C8;--line:#2E3862;--hi:#E8C93A;--hi-ink:#2B2200;--ok:#4CC38A;--ok-ink:#08210F;--bad:#FF8076;--accent:#8E9CFF;--accent-ink:#10152B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:19px;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
.date,.sub,.hint{color:var(--mute);font-size:14px}
.date{margin:4px 0 0;font-size:15px}
.count{background:var(--hi);color:var(--hi-ink);border-radius:99px;padding:1px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.bad{color:var(--bad);font-weight:600;font-size:14px}
.ok{color:var(--ok);font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 16px;font-weight:600;min-height:44px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 10px}
.chip{padding:7px 0;border:1.5px solid var(--line);background:transparent;color:var(--mute);font-size:11px;line-height:1.3;text-align:center;min-height:44px}
.chip b{display:block;font-size:12px;color:var(--ink)}
.chip.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.chip.done b{color:var(--ok-ink)}
.chip.due{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.chip.due b{color:var(--hi-ink)}
.chip.over{border-color:var(--bad);color:var(--bad)}
.chip.over b{color:var(--bad)}
.del{background:none;color:var(--mute);font-size:13px;padding:6px 8px}
.del.sure{color:var(--bad);font-weight:600}
input{font:inherit;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.add .btn{width:100%;margin-top:10px}
.empty{color:var(--mute)}
footer{margin-top:28px;font-size:13px;color:var(--mute)}
.acts{display:flex;flex-shrink:0}
.lnk{background:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 8px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.btn2{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 12px;font-size:14px;min-height:44px}
#msg{min-height:1.4em;margin:0 0 8px;color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>Revision tracker</h1>
  <p class="date" id="date"></p>

  <h2>Revise today <span class="count" id="dueCount">0</span></h2>
  <div id="due"></div>

  <h2>Add what you studied</h2>
  <div class="card add">
    <input id="name" placeholder="Topic, e.g. Newton’s laws of motion" autocomplete="off">
    <div class="grid">
      <input id="subj" placeholder="Subject (optional)" autocomplete="off">
      <input id="when" type="date" aria-label="Date studied">
    </div>
    <button class="btn" data-act="add">Add topic</button>
  </div>

  <h2>All topics</h2>
  <p class="hint" style="margin:-4px 0 10px">Tap a day to mark it revised. Tap again to undo.</p>
  <div class="tools"><button class="btn2" data-act="calall">Add all to calendar</button><button class="btn2" data-act="backup">Backup</button><button class="btn2" data-act="restore">Restore</button><input type="file" id="file" accept=".json,application/json" hidden></div>
  <p class="hint" id="msg" role="status"></p>
  <div id="all"></div>
  <footer id="foot">Works offline. Everything is saved on this phone only, so use Backup now and then.</footer>
</main>
<script>
const IV=[1,3,7,15,30,90],KEY='revtracker.v1',MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let items=[],ref=null,pend=null,q=Promise.resolve();
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const plus=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const today=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const days=n=>n+(n===1?' day':' days');
const rel=d=>d===0?'today':d===1?'tomorrow':d>0?'in '+days(d):days(-d)+' overdue';
const st=(t,n)=>{if(t.done[n])return'done';const d=diff(plus(t.studied,n),today());return d<0?'over':d===0?'due':'up'};
const nextN=t=>IV.find(n=>!t.done[n]);

function lsGet(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
  if(ref){const snap=JSON.parse(JSON.stringify(items));q=q.then(()=>ref.set({items:snap})).catch(()=>{})}
}
function commit(){save();render()}

function render(){
  const T=today();
  $('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const due=[];
  items.forEach(t=>{
    const ns=IV.filter(n=>!t.done[n]&&diff(plus(t.studied,n),T)<=0);
    if(ns.length)due.push({t,ns,late:-diff(plus(t.studied,ns[0]),T)});
  });
  due.sort((a,b)=>b.late-a.late||a.t.name.localeCompare(b.t.name));
  $('#dueCount').textContent=due.length;
  $('#due').innerHTML=due.length?due.map(({t,ns,late})=>`<div class="card row"><div><div class="name">${esc(t.name)}</div><div class="sub">${t.subject?esc(t.subject)+', ':''}studied ${fmt(t.studied)}</div><div class="${late>0?'bad':'sub'}">Revise ${ns.map(n=>'Day '+n).join(', ')}${late>0?', '+days(late)+' overdue':''}</div></div><button class="btn" data-act="done" data-id="${t.id}">Done</button></div>`).join(''):`<div class="card empty">Nothing to revise today. Add what you studied below and its revision dates appear automatically.</div>`;

  const all=items.slice().sort((a,b)=>{
    const na=nextN(a),nb=nextN(b);
    if(!na||!nb)return(na?0:1)-(nb?0:1);
    return plus(a.studied,na).localeCompare(plus(b.studied,nb));
  });
  $('#all').innerHTML=all.length?all.map(t=>{
    const n=nextN(t),nd=n&&plus(t.studied,n);
    return `<div class="card"><div class="row"><div><div class="name">${esc(t.name)}</div><div class="sub">${t.subject?esc(t.subject)+', ':''}studied ${fmt(t.studied)}</div></div><div class="acts"><button class="lnk" data-act="cal" data-id="${t.id}">Calendar</button><button class="del${pend===t.id?' sure':''}" data-act="del" data-id="${t.id}">${pend===t.id?'Tap to delete':'Delete'}</button></div></div><div class="chips">${IV.map(i=>{const s=st(t,i),d=fmt(plus(t.studied,i));return `<button class="chip ${s}" data-act="tog" data-id="${t.id}" data-n="${i}" aria-label="Day ${i}, ${d}, ${s==='done'?'revised':'not revised'}"><b>Day ${i}</b>${d}</button>`}).join('')}</div><div>${n?`Next revision: <b>${fmt(nd)}</b> <span class="sub">(${rel(diff(nd,T))})</span>`:`<span class="ok">All six revisions complete</span>`}</div></div>`;
  }).join(''):`<div class="card empty">No topics yet.</div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,t=items.find(x=>x.id===b.dataset.id);
  if(a==='cal'){exportCal(t?[t]:[]);return}
  if(a==='calall'){exportCal(items);return}
  if(a==='backup'){backup();return}
  if(a==='restore'){$('#file').click();return}
  if(a!=='del')pend=null;
  if(a==='add'){
    const name=$('#name').value.trim();
    if(!name){$('#name').focus();return}
    items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,subject:$('#subj').value.trim(),studied:$('#when').value||today(),done:{}});
    $('#name').value='';$('#subj').value='';
  }else if(a==='done'&&t){
    IV.forEach(n=>{if(!t.done[n]&&diff(plus(t.studied,n),today())<=0)t.done[n]=true});
  }else if(a==='tog'&&t){
    const n=b.dataset.n;if(t.done[n])delete t.done[n];else t.done[n]=true;
  }else if(a==='del'&&t){
    if(pend===t.id){items=items.filter(x=>x!==t);pend=null}else{pend=t.id;render();return}
  }
  commit();
});
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-act="add"]').click()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

let nt;
function note(m){$('#msg').textContent=m;clearTimeout(nt);nt=setTimeout(()=>$('#msg').textContent='',7000)}
async function sendFile(name,text,type){
  const file=new File([text],name,{type});
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}catch(e){if(e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
}
function exportCal(list){
  const T=today(),stamp=new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),x=s=>String(s).replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Revision Tracker//EN','CALSCALE:GREGORIAN'];let k=0;
  list.forEach(t=>IV.forEach(n=>{
    const d=plus(t.studied,n);if(t.done[n]||d<T)return;k++;
    L.push('BEGIN:VEVENT','UID:'+t.id+'-'+n+'@revision-tracker','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d.replace(/-/g,''),'DTEND;VALUE=DATE:'+plus(d,1).replace(/-/g,''),'SUMMARY:'+x('Revise: '+t.name+' (Day '+n+')'),'DESCRIPTION:'+x((t.subject?t.subject+'. ':'')+'Studied '+fmt(t.studied)),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Revision due','TRIGGER:PT9H','END:VALARM','END:VEVENT');
  }));
  L.push('END:VCALENDAR');
  if(!k){note('No upcoming revisions to add.');return}
  sendFile('revision-schedule.ics',L.map(l=>l.replace(/(.{73})(?=.)/g,'$1\r\n ')).join('\r\n')+'\r\n','text/calendar').then(ok=>ok&&note(k+' revision dates ready. Open the file to add them to your calendar.'));
}
function backup(){sendFile('revision-backup-'+today()+'.json',JSON.stringify({app:'revision-tracker',version:1,items}),'application/json').then(ok=>ok&&note('Backup saved. Keep it somewhere safe.'))}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text()),list=Array.isArray(d)?d:d.items,have=new Set(items.map(x=>x.id));let k=0;
    list.forEach(x=>{if(x&&x.id&&x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.studied)&&!have.has(String(x.id))){items.push({id:String(x.id),name:String(x.name),subject:String(x.subject||''),studied:x.studied,done:x.done&&typeof x.done==='object'?x.done:{}});k++}});
    commit();note(k?k+' topics restored.':'Nothing new to restore.');
  }catch(err){note('That file isn’t a valid backup.')}
});

items=lsGet();
$('#when').value=today();
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
